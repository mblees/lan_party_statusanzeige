; PlatformIO Project Configuration File
;
; Ziel: ESP32-C3 Super Mini
;   pio run -t upload      (Firmware)
;   pio run -t uploadfs    (Dateisystem mit den Bildern aus data/)

[env]
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter, colorize

[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.filesystem = littlefs
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial ueber die USB-C-Buchse (kein UART-Adapter noetig)
lib_deps =
	adafruit/Adafruit GC9A01A@^1.1.0
	adafruit/Adafruit GFX Library@^1.12.6
	bitbank2/PNGdec@^1.1.6
